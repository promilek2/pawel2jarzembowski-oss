# Słownik synonimów świadczeń NFZ.
#
# Jak dodać wpis: skopiuj blok [[benefit]], zmień pola, uruchom `pytest tests/test_benefits.py`
# i otwórz PR. Szczegóły w CONTRIBUTING.md.
#
# Pola:
#   id              krótki, stały identyfikator (a-z, 0-9, -)
#   label           nazwa dla ludzi (pokazywana w podpowiedziach)
#   query           FRAGMENT nazwy świadczenia przekazywany do NFZ (wyszukiwanie pełnotekstowe)
#   aliases         jak ludzie nazywają TO świadczenie: potocznie, skrótami. Bez objawów
#                   i chorób („migrena”, „cukrzyca”): nie dajemy porad medycznych, a dobór
#                   specjalisty należy do lekarza kierującego. Literówek nie trzeba
#                   dopisywać, bo łapie je fuzzy matching.
#   children_query  (opcjonalnie) fragment dla wariantu dziecięcego; jeśli jest, zapytanie
#                   bez wskazania „dla dzieci/dorosłych” jest dwuznaczne
#   exclude         (opcjonalnie) fragmenty nazw do odrzucenia w wariancie dla dorosłych
#   kind            "poradnia" | "badanie" | "zabieg" | "szpital"
#
# Uwaga: `query` to fragment, a nie dokładna nazwa (ADR-0008). Nazwy NFZ sprawdzisz komendą
# `termin swiadczenia <fragment>`.

[[benefit]]
id = "kardiolog"
label = "Kardiolog (poradnia kardiologiczna)"
query = "PORADNIA KARDIOLOGICZNA"
children_query = "PORADNIA KARDIOLOGICZNA DLA DZIECI"
exclude = ["DLA DZIECI"]
aliases = ["kardiolog", "kardiologia", "lekarz od serca", "kardiologiczna"]
kind = "poradnia"

