Wyniki są jak bilety: najlepsze dopasowanie jest pierwsze, przy każdym masz telefon, odległość i prognozę czasu oczekiwania."""
keywords_en = ["search", "find", "look for", "how to use", "how do i start", "specialist", "doctor", "clinic"]
answer_en = """At the top, type what you need (e.g. “okulista” for an eye doctor, “kardiolog”, “rezonans” for MRI) and where you are (city, postcode or “Use my location”). Tap “Find appointments”.
In “More options” you can set the distance, what matters most (earliest, nearest or balanced), the referral type (regular or urgent) and the “Step-free access only” filter.
Results look like tickets: the best match is first, each with a phone number, distance and the waiting-time forecast."""
keywords_uk = ["шука", "знайти", "пошук", "як користуват", "з чого почат", "спеціаліст", "лікар", "поліклінік"]
answer_uk = """Угорі введіть, що шукаєте (напр. «okulista» — окуліст, «kardiolog», «rezonans» — МРТ), і де ви (місто, поштовий код або «Використати моє місцезнаходження»). Натисніть «Шукати прийом».
У «Більше параметрів» можна задати відстань, що найважливіше (найшвидше, найближче або компроміс), тип направлення (звичайне чи термінове) і фільтр «Лише без бар’єрів».
Результати виглядають як квитки: найкращий — перший, у кожному є телефон, відстань і прогноз очікування."""

[[topic]]
id = "forecast"
keywords = ["prognoz", "pcus", "okolo", "mies", "tyg", "termin nie", "pierwszy wolny", "wolny termin", "dlaczego nie ma daty", "data", "dokladn"]
answer = """Od lipca 2026 NFZ nie podaje już pierwszego wolnego terminu. Zamiast tego publikuje prognozę czasu oczekiwania (PCUŚ), np. „1 mies. 3 tyg.”. Termin pokazuje ją jako „prognoza NFZ · ok. [data]”, czyli dzisiaj plus prognoza.
To nie jest zarezerwowany termin. Zadzwoń do placówki i zapytaj o najbliższy wolny. „Stan na” przy wyniku mówi, z którego dnia są dane (placówki aktualizują je mniej więcej raz w tygodniu)."""
keywords_en = ["forecast", "pcus", "month", "week", "first free", "free date", "exact date", "why no date"]
answer_en = """Since July 2026 NFZ no longer publishes the first available date. Instead it publishes a waiting-time forecast (PCUŚ), e.g. “1 mies. 3 tyg.” (1 month 3 weeks). Termin shows it as “NFZ forecast · ~[date]”, i.e. today plus the forecast.
It is not a booked appointment. Call the facility and ask for the nearest free date. “as of” next to a result tells you which day the data is from (facilities update it about once a week)."""
keywords_uk = ["прогноз", "pcus", "місяц", "тижн", "перший вільн", "вільн", "точн дат", "чому немає дат"]
answer_uk = """З липня 2026 NFZ більше не публікує першу вільну дату. Натомість публікується прогноз часу очікування (PCUŚ), напр. «1 mies. 3 tyg.» (1 місяць 3 тижні). Termin показує його як «прогноз NFZ · ~[дата]», тобто сьогодні плюс прогноз.
Це не заброньований прийом. Зателефонуйте до закладу й запитайте про найближчу вільну дату. «станом на» біля результату показує, з якого дня дані (заклади оновлюють їх приблизно раз на тиждень)."""

