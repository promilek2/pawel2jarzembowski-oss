answer = """Nie udzielam porad medycznych i nie oceniam objawów ani wyników badań. Z takimi pytaniami zwróć się do lekarza: zwykle najpierw do lekarza rodzinnego (POZ), który w razie potrzeby wystawi skierowanie do specjalisty.
W nagłej sytuacji dzwoń pod 112. Nocna i świąteczna opieka zdrowotna: informacja pod numerem 800 190 590 (Telefoniczna Informacja Pacjenta NFZ)."""
keywords_en = ["symptom", "pain", "hurt", "diagnos", "medicine", "medication", "pill", "dose", "disease", "illness", "sick", "what is wrong", "test result"]
answer_en = """I don't give medical advice and I don't assess symptoms or test results. Please ask a doctor: usually your family doctor (POZ) first, who can refer you to a specialist.
In an emergency call 112. Night and holiday care information: 800 190 590 (NFZ Patient Information Line)."""
keywords_uk = ["симптом", "болить", "біль", "діагноз", "ліки", "таблетк", "доз", "хвороб", "хворий", "що зі мною", "результат аналіз"]
answer_uk = """Я не надаю медичних порад і не оцінюю симптоми чи результати аналізів. Зверніться до лікаря: зазвичай спочатку до сімейного лікаря (POZ), який за потреби дасть направлення до спеціаліста.
У невідкладній ситуації телефонуйте 112. Інформація про нічну та святкову допомогу: 800 190 590 (Телефонна інформація для пацієнтів NFZ)."""

