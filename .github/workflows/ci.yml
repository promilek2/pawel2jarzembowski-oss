name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint i typy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict termin

  test:
    name: Testy (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - name: pytest (bez sieci)
        run: pytest --cov=termin --cov-report=term --cov-report=xml
      - name: Pokrycie termin/core >= 85%
        run: coverage report --include="termin/core/*" --fail-under=85

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv pip install -e ".[dev,e2e]"
      - run: playwright install --with-deps chromium
      - run: pytest -m e2e tests/e2e

  docker:
    name: Obraz Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: termin:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Healthcheck kontenera
        run: |
          docker run -d --name termin -p 8000:8000 termin:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && exit 0; sleep 1; done
          docker logs termin; exit 1
