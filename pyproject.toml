[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "termin-nfz"
dynamic = ["version"]
description = "Najszybszy termin u specjalisty na NFZ: gdzie, jak daleko, jak dojechać i pod jaki numer zadzwonić."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Termin contributors" }]
keywords = ["nfz", "kolejki", "terminy", "zdrowie", "polska", "open-data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Polish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "typer>=0.12",
  "rich>=13.7",
  "rapidfuzz>=3.9",
  "fastapi>=0.111",
  "uvicorn>=0.32",
  "slowapi>=0.1.9",
  "prometheus-client>=0.20",
  "segno>=1.6",
  "cryptography>=42",
  "anthropic>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
e2e = [
  "playwright>=1.47",
  "axe-playwright-python>=0.1.4",
]

[project.scripts]
termin = "termin.cli:main"

[project.urls]
Homepage = "https://github.com/promilek2/pawel2jarzembowski-oss"
Issues = "https://github.com/promilek2/pawel2jarzembowski-oss/issues"

[tool.hatch.version]
path = "termin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["termin"]

[tool.hatch.build.targets.sdist]
include = ["termin", "tests", "README.md", "README.en.md", "LICENSE", "PRIVACY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -m 'not live and not e2e'"
markers = [
  "live: testy na prawdziwym API NFZ (domyślnie pomijane, uruchom: pytest -m live)",
  "e2e: testy przeglądarkowe Playwright (uruchom: pytest -m e2e)",
]
filterwarnings = [
  "error::pytest.PytestUnraisableExceptionWarning",
  "error::ResourceWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["termin"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "DTZ", "PT", "C4"]
ignore = [
  "S101",  # assert w testach
  "RUF001", "RUF002", "RUF003",  # polskie znaki w stringach/komentarzach
  "PT018",  # złożone asercje są czytelne w testach
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
"scripts/**" = ["S", "DTZ"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "axe_playwright_python.*"]
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "typer.Argument", "typer.Option",
  "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header",
]
